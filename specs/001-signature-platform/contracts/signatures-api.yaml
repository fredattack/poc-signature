openapi: 3.0.3
info:
  title: Signatures API
  description: API for managing digital autograph signatures
  version: 1.0.0
  contact:
    name: Digital Autograph Platform Team

servers:
  - url: https://api.signatureapp.com/v1
    description: Production
  - url: https://staging-api.signatureapp.com/v1
    description: Staging
  - url: http://localhost:3000/v1
    description: Local development

tags:
  - name: signatures
    description: Signature CRUD operations

security:
  - bearerAuth: []

paths:
  /signatures:
    get:
      summary: List user signatures
      description: Retrieve all signatures for authenticated user with pagination
      tags:
        - signatures
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of signatures per page
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of signatures to skip
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [recent, oldest, name_asc, name_desc]
            default: recent
          description: Sort order for signatures (FR-012)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Signature'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      summary: Create signature
      description: Upload new signature with metadata (FR-003, FR-004)
      tags:
        - signatures
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - celebrityName
                - signatureImage
                - signatureColor
                - capturedAt
              properties:
                celebrityName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Name of celebrity who signed (FR-003)
                signatureImage:
                  type: string
                  format: binary
                  description: PNG file of signature drawing
                signatureColor:
                  type: string
                  enum: [black, blue, red, white]
                  description: Stroke color used (FR-002)
                capturedAt:
                  type: string
                  format: date-time
                  description: Timestamp of signature capture (FR-003)
                location:
                  type: object
                  description: Optional location data (FR-004)
                  properties:
                    city:
                      type: string
                    country:
                      type: string
                    latitude:
                      type: number
                      format: double
                    longitude:
                      type: number
                      format: double
      responses:
        '201':
          description: Signature created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Signature'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Signature limit reached (free users)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: SIGNATURE_LIMIT_REACHED
                  message: "Free users can only create 10 signatures. Upgrade to premium for unlimited signatures."
                  details:
                    currentCount: 10
                    limit: 10
        '413':
          description: File too large (max 5MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /signatures/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Signature ID

    get:
      summary: Get signature by ID
      description: Retrieve single signature with full metadata (FR-013)
      tags:
        - signatures
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Signature'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Delete signature
      description: Remove signature from user collection (FR-014)
      tags:
        - signatures
      responses:
        '204':
          description: Signature deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /signatures/sync:
    post:
      summary: Batch sync signatures
      description: Sync multiple offline-created signatures to cloud (FR-023)
      tags:
        - signatures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - signatures
              properties:
                signatures:
                  type: array
                  items:
                    type: object
                    required:
                      - localId
                      - celebrityName
                      - signatureImageBase64
                      - signatureColor
                      - capturedAt
                    properties:
                      localId:
                        type: string
                        format: uuid
                        description: Client-generated ID for deduplication
                      celebrityName:
                        type: string
                      signatureImageBase64:
                        type: string
                        description: Base64-encoded PNG image
                      signatureColor:
                        type: string
                        enum: [black, blue, red, white]
                      capturedAt:
                        type: string
                        format: date-time
                      location:
                        type: object
                        properties:
                          city:
                            type: string
                          country:
                            type: string
                          latitude:
                            type: number
                          longitude:
                            type: number
      responses:
        '200':
          description: Batch sync results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      synced:
                        type: array
                        items:
                          type: object
                          properties:
                            localId:
                              type: string
                              format: uuid
                            serverId:
                              type: string
                              format: uuid
                            cloudImageUrl:
                              type: string
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            localId:
                              type: string
                              format: uuid
                            error:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token or custom JWT

  schemas:
    Signature:
      type: object
      required:
        - id
        - userId
        - celebrityName
        - cloudImageUrl
        - signatureColor
        - capturedAt
        - syncStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique signature identifier
        userId:
          type: string
          format: uuid
          description: Owner user ID
        celebrityName:
          type: string
          description: Name of celebrity who signed
        cloudImageUrl:
          type: string
          format: uri
          description: URL to signature image in cloud storage
        signatureColor:
          type: string
          enum: [black, blue, red, white]
          description: Stroke color used
        capturedAt:
          type: string
          format: date-time
          description: When signature was captured
        location:
          type: object
          nullable: true
          properties:
            city:
              type: string
            country:
              type: string
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
        syncStatus:
          type: string
          enum: [pending, synced, error]
          description: Cloud sync status
        createdAt:
          type: string
          format: date-time
          description: Record creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp

    Pagination:
      type: object
      properties:
        total:
          type: integer
          description: Total number of signatures
        limit:
          type: integer
          description: Results per page
        offset:
          type: integer
          description: Number of results skipped
        hasMore:
          type: boolean
          description: Whether more results exist

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              description: Additional error context

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: "celebrityName is required and must be 1-100 characters"
              details:
                field: celebrityName

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: "Valid authentication token required"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: "Signature not found or does not belong to user"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: "An unexpected error occurred. Please try again later."
