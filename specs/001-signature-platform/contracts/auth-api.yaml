openapi: 3.0.3
info:
  title: Authentication API
  description: User authentication and account management
  version: 1.0.0

servers:
  - url: https://api.signatureapp.com/v1
    description: Production
  - url: http://localhost:3000/v1
    description: Local development

tags:
  - name: auth
    description: Authentication operations

paths:
  /auth/register:
    post:
      summary: Register new user
      description: Create account with email/password (FR-020)
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  description: Minimum 8 characters
                firstName:
                  type: string
                  maxLength: 50
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: Login with email/password
      description: Authenticate user and receive JWT token (FR-020)
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/social:
    post:
      summary: Social authentication
      description: Login/register with Google or Apple Sign-In (FR-021)
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
                - idToken
              properties:
                provider:
                  type: string
                  enum: [google, apple]
                idToken:
                  type: string
                  description: OAuth ID token from provider
      responses:
        '200':
          description: Social auth successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      summary: Refresh auth token
      description: Get new JWT before expiration
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time

  /auth/me:
    get:
      summary: Get current user profile
      description: Retrieve authenticated user data
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        avatar:
          type: string
          format: uri
          nullable: true
        authProvider:
          type: string
          enum: [email, google, apple, anonymous]
        isPremium:
          type: boolean
        signatureCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      required:
        - token
        - refreshToken
        - user
      properties:
        token:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: Refresh token for token renewal
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
