openapi: 3.0.3
info:
  title: Subscriptions API
  description: Premium subscription management via Stripe
  version: 1.0.0

servers:
  - url: https://api.signatureapp.com/v1
    description: Production

tags:
  - name: subscriptions
    description: Premium subscription operations

security:
  - bearerAuth: []

paths:
  /subscriptions/checkout:
    post:
      summary: Create checkout session
      description: Initialize Stripe checkout for subscription (FR-025, FR-026)
      tags:
        - subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - plan
              properties:
                plan:
                  type: string
                  enum: [monthly, annual]
                  description: Subscription plan type
                successUrl:
                  type: string
                  format: uri
                  description: Redirect URL after successful payment
                cancelUrl:
                  type: string
                  format: uri
                  description: Redirect URL if payment canceled
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                    description: Stripe checkout session ID
                  url:
                    type: string
                    format: uri
                    description: Stripe checkout URL
        '401':
          description: Unauthorized
        '409':
          description: User already has active subscription

  /subscriptions/status:
    get:
      summary: Get subscription status
      description: Check current user's subscription details
      tags:
        - subscriptions
      responses:
        '200':
          description: Subscription status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Subscription'
                  isPremium:
                    type: boolean
        '404':
          description: No active subscription

  /subscriptions/cancel:
    post:
      summary: Cancel subscription
      description: Cancel subscription at period end
      tags:
        - subscriptions
      responses:
        '200':
          description: Subscription will cancel at period end
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Subscription'
        '404':
          description: No active subscription

  /subscriptions/webhooks/stripe:
    post:
      summary: Stripe webhook endpoint
      description: Handle subscription events from Stripe
      tags:
        - subscriptions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe webhook event payload
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid signature or payload

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        plan:
          type: string
          enum: [monthly, annual]
        status:
          type: string
          enum: [trialing, active, expired, canceled]
        startDate:
          type: string
          format: date-time
        trialEndDate:
          type: string
          format: date-time
          nullable: true
          description: End of 7-day free trial (FR-026)
        currentPeriodEnd:
          type: string
          format: date-time
        cancelAtPeriodEnd:
          type: boolean
        price:
          type: number
          format: decimal
          description: Subscription price in dollars
        currency:
          type: string
          example: USD
